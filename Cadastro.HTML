        <span>📍 Londrina/PR</span>
    </div>

    <div id="contador"></div>
</header>

<div class="container">

<form id="formCadastro">

<p>
Preencha o formulário abaixo para participação no evento DevTech. 
Todas as informações serão utilizadas apenas para fins de organização.
</p>

<div class="form-group">
    <label>Nome completo:</label>
    <input type="text" name="nome" required>
</div>

<div class="form-group">
    <label>Email:</label>
    <input type="email" name="email" required>
</div>

<div class="form-group">
    <label>Telefone:</label>
    <input type="tel" name="telefone">
</div>

<div class="form-group">
    <label>Data de nascimento:</label>
    <input type="date" name="nascimento">
</div>

<div class="form-group">
    <label>Área de atuação:</label>
    <select name="atuacao">
        <option>Estudante</option>
        <option>Desenvolvedor</option>
        <option>Outro</option>
    </select>
</div>

<div class="form-group">
    <label>Qual atividade você tem mais interesse?</label>
    <div class="radio-group">
        <label><input type="radio" name="atividade" value="IA"> Palestras sobre IA</label>
        <label><input type="radio" name="atividade" value="Mobile"> Workshop Mobile</label>
        <label><input type="radio" name="atividade" value="Ambos"> Ambos</label>
    </div>
</div>

<div class="form-group">
    <label>Como ficou sabendo do evento?</label>
    <div class="radio-group">
        <label><input type="checkbox" name="origem[]" value="Instagram"> Instagram</label>
        <label><input type="checkbox" name="origem[]" value="faculdade"> Faculdade / Escola</label>
        <label><input type="checkbox" name="origem[]" value="amigos"> Amigos</label>
        <label><input type="checkbox" name="origem[]" value="Internet"> Internet</label>
        <label><input type="checkbox" id="check" onclick="toggleCampo()" name="origem[]" value="outros"> Outro</label>
        <label><input type="text" id="meuInput" name="outrostexto" disabled>Digite aqui...</label>
    </div>
    

</div>

<div class="form-group">
    <label>Observações:</label>
    <textarea id="outros" rows="4"></textarea>
</div>

<!--Config Formspree-->
<input type="hidden" name="_subject" value="Nova inscrição - DevTech">


<button type="submit" id="btnEnviar">Enviar</button>

</form>

</div>



<footer>
    © 2026 DevTech
</footer>

<script src="assets/js/script.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
 
    const form = document.getElementById("formCadastro");
    const botao = document.getElementById("btnEnviar");
 
    form.addEventListener("submit", async function (e) {
        e.preventDefault();
 
        botao.disabled = true;
        botao.innerText = "Enviando...";
 
        const formData = new FormData(form);
 
const dados = {
    nome: formData.get("nome"),
    email: formData.get("email"),
    telefone: formData.get("telefone"),
    nascimento: formData.get("nascimento"),
    atuacao: formData.get("atuacao"),
    interesse: formData.get("interesse"),
    fonte: formData.getAll("origem[]").join(", "),
    fonte_outros: formData.get("outrostexto"),
    outros: formData.get("outros")
};
 
        try {
            const { error } = await supabaseClient
                .from("Cadastro")
                .insert([dados]);
 
            if (error) { 
             
                 alert(error.message);
                 return;
             
                }
 
        } catch (err) {
            console.error(err);
            alert("Erro ao salvar no banco.");
        }
 
        botao.disabled = false;
        botao.innerText = "Confirmar Inscrição";
    });
 
});
</script>
